<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Destroy</title>
  <link rel="icon" href="../favicon.svg?v=1" type="image/svg+xml" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0f; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="target" title="The page being destroyed"></iframe>
  <script>
    // Loads another kmufti.com page in a same-origin frame and drops the
    // game into it. Only local paths: anything else would be cross-origin,
    // and the browser (rightly) won't let us touch it — that's the
    // bookmarklet's job.
    const p = new URLSearchParams(location.search).get("p") || "/";
    const safe = p.startsWith("/") && !p.startsWith("//") && !p.startsWith("/admin") && !p.startsWith("/destroy/play");
    const frame = document.getElementById("target");
    frame.src = safe ? p : "/";
    frame.addEventListener("load", () => {
      const w = frame.contentWindow, d = frame.contentDocument;
      if (!d || w.__kmDestroy) return;
      // Let the page's own scripts draw its tiles first.
      setTimeout(() => {
        const s = d.createElement("script");
        s.src = "/destroy/destroy.js?v=1";
        d.body.appendChild(s);
        w.addEventListener("kmdestroy:quit", () => { location.href = "/destroy/"; });
        w.focus();
      }, 700);
    });
  </script>
</body>
</html>
