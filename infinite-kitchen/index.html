<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Infinite Kitchen — kmufti.com</title>
  <link rel="icon" href="favicon.svg?v=1" type="image/svg+xml" />
  <meta name="description" content="Combine ingredients, techniques and cuisines to cook your way to every dish." />
  <!-- Not linked from the hub and not in search: you need the URL. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <header class="top">
    <a class="brand" href="../">kmufti.com</a>
    <h1>Infinite Kitchen</h1>
    <nav class="top-actions">
      <button type="button" id="bookBtn">Recipes</button>
      <button type="button" id="notebookBtn">Notebook <span class="pill" id="missingCount" hidden></span></button>
      <button type="button" id="clearBtn" title="Clear the cutting board">Clear</button>
      <button type="button" id="resetBtn" title="Forget every discovery and start over">Reset</button>
    </nav>
  </header>

  <main class="kitchen">
    <!-- The room: a 3D kitchen from one still camera (scene3d.js). The
         hidden stage below holds the tools, cookbooks and bin as plain
         elements: app.js sets their state (locked, target...) and the 3D
         room mirrors it. The board is a layer over the island top. -->
    <section class="room" id="room" aria-label="Kitchen">
      <canvas id="view"></canvas>
      <div class="stage" id="stage" hidden>
        <div class="cookbooks" id="cookbooks"></div>
        <button type="button" class="notepad" id="notepad">Notes</button>
        <div class="tool" data-tech="Ferment" data-label="Jars"></div>
        <div class="tool" data-tech="Wait" data-label="Clock"></div>
        <div class="tool" data-tech="Freeze" data-label="Fridge"></div>
        <div class="tool" data-tech="Heat" data-label="Stove"></div>
        <div class="tool" data-tech="Boil" data-label="Pot"></div>
        <div class="tool" data-tech="Fry" data-label="Pan"></div>
        <div class="tool" data-tech="Grill" data-label="Grill pan"></div>
        <div class="tool" data-tech="Blend" data-label="Blender"></div>
        <div class="tool" data-tech="Bake" data-label="Oven"></div>
        <div class="tool hand" data-tech="Mix" data-label="Bowl"></div>
        <div class="tool hand" data-tech="Cut" data-label="Knife"></div>
        <button type="button" class="recipe-book" id="recipeBook">Recipes</button>
        <button type="button" class="bin" id="bin">Bin</button>
      </div>
      <!-- the island top: drag food here, and onto each other -->
      <section class="counter" id="counter" aria-label="Kitchen island">
        <p class="counter-hint" id="hint">Drag food onto the island, onto each other, or onto a tool.</p>
      </section>
      <p class="spot-label" id="spotLabel" hidden></p>
    </section>

    <aside class="pantry" id="pantry" aria-label="Pantry">
      <div class="pantry-crown" aria-hidden="true">Pantry</div>
      <input class="search" id="search" type="search" placeholder="Search the pantry…" autocomplete="off" />
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="ingredient" aria-selected="true">Ingredients <span></span></button>
        <button type="button" role="tab" data-tab="dish">Dishes <span></span></button>
        <button type="button" role="tab" data-tab="trash">Bin <span></span></button>
      </div>
      <div class="shelf" id="shelf"></div>
      <div class="pantry-foot" id="pantryFoot"></div>
    </aside>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog class="sheet" id="bookDialog">
    <header><h2>Recipe book</h2><button type="button" class="close" data-close>&times;</button></header>
    <input class="search" id="bookSearch" type="search" placeholder="Find a recipe…" autocomplete="off" />
    <p class="sheet-sub" id="bookSummary"></p>
    <ol class="book" id="bookList"></ol>
  </dialog>

  <dialog class="sheet" id="notebookDialog">
    <header><h2>Notebook</h2><button type="button" class="close" data-close>&times;</button></header>
    <p class="sheet-sub">Pairs you tried that nobody has written a recipe for yet. They are sent to the kitchen, too, so they can be filled in.</p>
    <div class="sheet-actions">
      <button type="button" id="copyMissing">Copy as JSON</button>
      <a id="allMissing" target="_blank" rel="noopener">Everyone's list</a>
    </div>
    <ol class="notebook" id="missingList"></ol>
  </dialog>

  <script type="importmap">{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
  <script src="rules.js?v=9"></script>
  <script src="app.js?v=23"></script>
  <script type="module" src="scene3d.js?v=20"></script>
</body>
</html>
