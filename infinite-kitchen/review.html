<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipe Review — Infinite Kitchen</title>
  <link rel="icon" href="favicon.svg?v=1" type="image/svg+xml" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <link rel="stylesheet" href="review.css?v=1" />
</head>
<body class="review-page">
  <header class="top">
    <a class="brand" href="./">&larr; kitchen</a>
    <h1>Recipe review</h1>
    <span class="progress" id="progress"></span>
    <nav class="top-actions">
      <button type="button" id="exportBtn">Export JSON</button>
    </nav>
  </header>

  <div class="review-bar">
    <input class="search" id="q" type="search" placeholder="Search any item or result…" autocomplete="off" />
    <div class="filters" role="radiogroup" aria-label="Show">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="todo" aria-pressed="false">Not reviewed</button>
      <button type="button" data-filter="flagged" aria-pressed="false">Flagged</button>
      <button type="button" data-filter="fire" aria-pressed="false">Fire</button>
      <button type="button" data-filter="added" aria-pressed="false">Added by you</button>
    </div>
    <span class="saved" id="saved"></span>
  </div>

  <div class="review-layout">
    <nav class="jump" id="jump" aria-label="Jump to an item"></nav>
    <main class="groups" id="groups"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="review.js?v=1"></script>
</body>
</html>
