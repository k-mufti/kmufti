# nginx server block for the kmufti hub.
# Put this in /etc/nginx/sites-available/kmufti and symlink into sites-enabled,
# then run certbot to add the HTTPS (443) block automatically.
#
#   sudo ln -s /etc/nginx/sites-available/kmufti /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kmufti.com -d www.kmufti.com

server {
    listen 80;
    listen [::]:80;
    server_name kmufti.com www.kmufti.com;   # <-- your domain

    root /var/www/kmufti-hub;                 # <-- where you cloned the repo
    index index.html;

    # The ONE dynamic bit: forward the wishlist API to the Node backend.
    # The frontend calls relative "api/..." which resolves to /wishlist/api/...
    location /wishlist/api/ {
        proxy_pass http://127.0.0.1:8021/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Shared drawing canvas backend: SSE stream + batched paint POSTs.
    # proxy_buffering off is required so the event stream isn't held back.
    location /draw/api/ {
        proxy_pass http://127.0.0.1:8022/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Jigsaw: the shared puzzle table. The socket is a real WebSocket, so it
    # gets the Upgrade headers and a long read timeout; the plain JSON routes
    # (archive, replay) are proxied normally. Splitting them this way avoids
    # needing a `map $http_upgrade $connection_upgrade` in the http block.
    location = /puzzle/api/socket {
        proxy_pass http://127.0.0.1:8023/api/socket;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /puzzle/api/ {
        proxy_pass http://127.0.0.1:8023/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Yahtzee: the 1v1 dice table. Same split as Jigsaw - the socket gets the
    # Upgrade headers and a long read timeout, everything else is plain JSON.
    location = /yahtzee/api/socket {
        proxy_pass http://127.0.0.1:8024/api/socket;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /yahtzee/api/ {
        proxy_pass http://127.0.0.1:8024/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Infinite Kitchen: the list of pairs players tried that have no recipe
    # yet. Plain JSON. X-Real-IP is for the backend's per-IP rate limit.
    location /infinite-kitchen/api/ {
        proxy_pass http://127.0.0.1:8027/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Meccha Chameleon: practice photos, fetched from Pexels and cached by the
    # backend. Served from our own origin rather than hotlinked because the
    # game reads pixels off the photo and a cross-origin image would taint the
    # canvas. Plain JSON and JPEGs - no socket here.
    # ^~ matters: the static-asset regex below matches .jpg, and in nginx a
    # regex location beats a plain prefix one - without it the photo bytes are
    # looked for on disk and 404 while the JSON routes, having no extension,
    # work fine and hide the problem.
    location ^~ /chameleon/api/ {
        proxy_pass http://127.0.0.1:8025/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # The ops dashboard: the one page here that is not for visitors. Password
    # on the nginx side, backend bound to 127.0.0.1, and noindex on the way out
    # so it can't turn up in a search result even by accident.
    #
    # ^~ on both, for the reason the chameleon photos needed it: the static
    # asset regex below matches .css and .js, and a regex location beats a
    # plain prefix one - without ^~ the page would ask for a password while
    # admin.css and admin.js were handed out to anyone who asked.
    location ^~ /admin/api/ {
        auth_basic "kmufti ops";
        auth_basic_user_file /etc/nginx/.kmufti-admin;
        proxy_pass http://127.0.0.1:8026/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location ^~ /admin/ {
        auth_basic "kmufti ops";
        auth_basic_user_file /etc/nginx/.kmufti-admin;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    # Nothing that starts with a dot is served. The web root IS the git
    # checkout, so without this `/.git/config` answers 200 and the whole
    # history can be walked - and /.git is, by a wide margin, the most
    # requested path in the access log. Scanners find it before people do.
    #
    # The negative lookahead keeps /.well-known reachable, or certbot can no
    # longer answer the ACME challenge and the certificate stops renewing.
    # Deliberately `deny` rather than `access_log off`: a 403 still gets
    # logged, so the dashboard keeps showing you who is rattling the handle.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # HTML: always revalidate so a git pull shows up immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Static assets: cache, but they're ?v=-busted when they change.
    location ~* \.(css|js|json|svg|png|ico|woff2)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
