# nginx server block for the kmufti hub.
# Put this in /etc/nginx/sites-available/kmufti and symlink into sites-enabled,
# then run certbot to add the HTTPS (443) block automatically.
#
#   sudo ln -s /etc/nginx/sites-available/kmufti /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kmufti.com -d www.kmufti.com

server {
    listen 80;
    listen [::]:80;
    server_name kmufti.com www.kmufti.com;   # <-- your domain

    root /var/www/kmufti-hub;                 # <-- where you cloned the repo
    index index.html;

    # The ONE dynamic bit: forward the wishlist API to the Node backend.
    # The frontend calls relative "api/..." which resolves to /wishlist/api/...
    location /wishlist/api/ {
        proxy_pass http://127.0.0.1:8021/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Shared drawing canvas backend: SSE stream + batched paint POSTs.
    # proxy_buffering off is required so the event stream isn't held back.
    location /draw/api/ {
        proxy_pass http://127.0.0.1:8022/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Jigsaw: the shared puzzle table. The socket is a real WebSocket, so it
    # gets the Upgrade headers and a long read timeout; the plain JSON routes
    # (archive, replay) are proxied normally. Splitting them this way avoids
    # needing a `map $http_upgrade $connection_upgrade` in the http block.
    location = /puzzle/api/socket {
        proxy_pass http://127.0.0.1:8023/api/socket;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /puzzle/api/ {
        proxy_pass http://127.0.0.1:8023/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # HTML: always revalidate so a git pull shows up immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Static assets: cache, but they're ?v=-busted when they change.
    location ~* \.(css|js|json|svg|png|ico|woff2)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
