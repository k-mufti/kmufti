<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Board</title>
  <link rel="icon" href="wavelength/favicon.svg?v=1" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;1,9..144,700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Game Board: a shelf of board-game spin-offs. Each box opens its game;
       the empty spots are for the ones still to come. */
    :root { --wall: #2a211b; --wood: #8a5a35; --wood-dark: #5e3a20; --paper: #f8f3e9; --soft: #c9b8a6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0%, #3a2d24 0%, var(--wall) 70%);
      color: var(--paper);
      font-family: "Rubik", system-ui, sans-serif;
    }
    .bar { padding: 16px; }
    .bar a { color: var(--soft); text-decoration: none; font-size: 14px; }
    .bar a:hover { color: var(--paper); }
    h1 {
      margin: 3vh 16px 4px;
      text-align: center;
      font-family: "Fraunces", serif;
      font-weight: 800;
      font-size: clamp(40px, 9vw, 72px);
      letter-spacing: -1px;
    }
    .sub { text-align: center; color: var(--soft); margin: 0 16px 6vh; }
    .shelf { max-width: 900px; margin: 0 auto; padding: 0 16px; }
    .row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(12px, 3vw, 28px);
      padding: 0 12px;
      min-height: 220px;
      flex-wrap: wrap;
    }
    .plank {
      height: 18px;
      background: linear-gradient(var(--wood) 0%, var(--wood-dark) 100%);
      border-radius: 3px;
      box-shadow: 0 10px 18px -6px rgba(0, 0, 0, 0.6);
      margin-bottom: 40px;
    }
    /* a game box, standing on its edge, its lid facing out */
    .box {
      width: 170px;
      height: 200px;
      border-radius: 6px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: transform 0.18s ease;
      box-shadow: 6px 0 0 rgba(0, 0, 0, 0.25), 0 14px 22px -10px rgba(0, 0, 0, 0.7);
    }
    a.box:hover { transform: translateY(-8px) rotate(-1deg); }
    .box.wave { background: #efe8da; color: #1d3d5c; }
    .box.wave svg { position: absolute; left: 10px; right: 10px; bottom: 16px; width: calc(100% - 20px); }
    .box.wave .name {
      position: absolute; top: 18px; left: 0; right: 0; text-align: center;
      font-family: "Fraunces", serif; font-style: italic; font-weight: 700; font-size: 25px;
    }
    .box.wave .tag { position: absolute; top: 52px; left: 0; right: 0; text-align: center; font-size: 11px; color: #5b6573; }
    .box.imp { background: #1f1535; color: #f6f0ff; }
    .box.imp svg { position: absolute; left: 14px; right: 14px; bottom: 14px; width: calc(100% - 28px); }
    .box.imp .name {
      position: absolute; top: 18px; left: 0; right: 0; text-align: center;
      font-family: "Fraunces", serif; font-weight: 800; font-size: 25px; letter-spacing: -0.5px;
    }
    .box.imp .tag { position: absolute; top: 52px; left: 0; right: 0; text-align: center; font-size: 11px; color: #ff6d8f; }
    .box.drf { background: #0f1216; color: #f4f1ea; }
    .box.drf svg { position: absolute; left: 14px; right: 14px; bottom: 14px; width: calc(100% - 28px); }
    .box.drf .name {
      position: absolute; top: 18px; left: 0; right: 0; text-align: center;
      font-family: "Fraunces", serif; font-weight: 800; font-size: 25px; letter-spacing: -0.5px;
    }
    .box.drf .tag { position: absolute; top: 52px; left: 0; right: 0; text-align: center; font-size: 11px; color: #2fe08a; }
    .box.tq { background: #e9e1cf; color: #1f2a44; }
    .box.tq svg { position: absolute; left: 14px; right: 14px; bottom: 12px; width: calc(100% - 28px); }
    .box.tq .name { position: absolute; top: 18px; left: 0; right: 0; text-align: center; font-family: "Fraunces", serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
    .box.tq .tag { position: absolute; top: 50px; left: 0; right: 0; text-align: center; font-size: 11px; color: #e4572e; }
    .box.clk { background: #0b100d; color: #eef5ef; }
    .box.clk svg { position: absolute; left: 12px; right: 12px; bottom: 12px; width: calc(100% - 24px); }
    .box.clk .name { position: absolute; top: 18px; left: 0; right: 0; text-align: center; font-family: "Fraunces", serif; font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
    .box.clk .tag { position: absolute; top: 48px; left: 0; right: 0; text-align: center; font-size: 11px; color: #22e06b; }
    .box.soon {
      border: 2px dashed rgba(201, 184, 166, 0.35);
      box-shadow: none;
      display: flex; align-items: center; justify-content: center;
      color: rgba(201, 184, 166, 0.55);
      font-size: 13px;
    }
    @media (max-width: 520px) {
      .box { width: 140px; height: 168px; }
      .box.wave .name, .box.imp .name, .box.drf .name { font-size: 21px; }
      .box.tq .name { font-size: 19px; }
      .box.clk .name { font-size: 17px; }
      .box.soon:nth-of-type(n+3) { display: none; }
    }
  </style>
</head>
<body>
  <div class="bar"><a href="../">&larr; kmufti.com</a></div>
  <h1>Game Board</h1>
  <p class="sub">Board games, off the shelf and onto your phone.</p>

  <div class="shelf">
    <div class="row">
      <a class="box wave" href="wavelength/">
        <span class="name">Wavelength</span>
        <span class="tag">read your friends' minds</span>
        <svg viewBox="-100 -100 200 108" aria-hidden="true">
          <circle r="96" fill="#fbfaf6"/>
          <circle r="90" fill="#1d3d5c"/>
          <circle r="84" fill="#f4efe4"/>
          <path d="M0 0L-27 -80A84 84 0 0 1 -12 -83Z" fill="#f3b52f"/>
          <path d="M0 0L-12 -83A84 84 0 0 1 3 -84Z" fill="#ee7a33"/>
          <path d="M0 0L3 -84A84 84 0 0 1 18 -82Z" fill="#a8d4e6"/>
          <path d="M0 0L18 -82A84 84 0 0 1 32 -78Z" fill="#ee7a33"/>
          <path d="M0 0L32 -78A84 84 0 0 1 45 -71Z" fill="#f3b52f"/>
          <rect x="-100" y="0" width="200" height="8" fill="#1d3d5c"/>
          <rect x="-100" y="-3" width="18" height="6" rx="3" fill="#7fd8c3"/>
          <rect x="82" y="-3" width="18" height="6" rx="3" fill="#7fd8c3"/>
          <path d="M-2.5 0L0 -80L2.5 0Z" fill="#d8342b" transform="rotate(12)"/>
          <circle r="14" fill="#d8342b"/>
        </svg>
      </a>
      <a class="box imp" href="imposter/">
        <span class="name">Imposter</span>
        <span class="tag">one of you is faking it</span>
        <svg viewBox="0 0 120 96" aria-hidden="true">
          <rect x="10" y="22" width="44" height="62" rx="7" fill="#f6f0ff" transform="rotate(-12 32 53)"/>
          <rect x="66" y="22" width="44" height="62" rx="7" fill="#f6f0ff" transform="rotate(12 88 53)"/>
          <rect x="38" y="14" width="44" height="64" rx="7" fill="#ff3d6e"/>
          <text x="60" y="58" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" fill="#fff">?</text>
        </svg>
      </a>
      <a class="box drf" href="draft/">
        <span class="name">Draft</span>
        <span class="tag">bid on the best of it</span>
        <svg viewBox="0 0 120 96" aria-hidden="true">
          <rect x="6" y="40" width="34" height="44" rx="6" fill="#20262e"/>
          <rect x="43" y="22" width="34" height="62" rx="6" fill="#ff5a1f"/>
          <rect x="80" y="48" width="34" height="36" rx="6" fill="#20262e"/>
          <text x="60" y="64" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="30" fill="#fff">$</text>
          <text x="23" y="68" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="15" fill="#2fe08a">$</text>
          <text x="97" y="72" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="13" fill="#2fe08a">$</text>
        </svg>
      </a>
      <a class="box tq" href="21-questions/">
        <span class="name">21 Questions</span>
        <span class="tag">guess it in 21</span>
        <svg viewBox="0 0 120 96" aria-hidden="true">
          <rect x="14" y="8" width="92" height="84" rx="6" fill="#fbf6e9"/>
          <path d="M14 30h92M14 46h92M14 62h92M14 78h92" stroke="#b9d3ec" stroke-width="1.5"/>
          <path d="M32 8v84" stroke="#e4572e" stroke-width="1.5"/>
          <text x="69" y="62" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" fill="#1f2a44">21</text>
          <text x="92" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="11" fill="#2a9d5c" transform="rotate(-8 92 88)">YES</text>
        </svg>
      </a>
      <a class="box clk" href="stop-the-clock/">
        <span class="name">Stop the Clock</span>
        <span class="tag">no peeking</span>
        <svg viewBox="0 0 120 96" aria-hidden="true">
          <rect x="52" y="18" width="16" height="8" rx="2" fill="#0f9a43"/>
          <rect x="10" y="26" width="100" height="58" rx="16" fill="#22e06b"/>
          <text x="60" y="66" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="28" fill="#06280f">10.00</text>
        </svg>
      </a>
    </div>
    <div class="plank"></div>
  </div>
</body>
</html>
