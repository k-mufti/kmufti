<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Board</title>
  <link rel="icon" href="frequency/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;1,9..144,700&family=Paytone+One&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Game Board: a shelf of board-game spin-offs. Each box opens its game;
       the empty spots are for the ones still to come. */
    :root { --wall: #2a211b; --wood: #8a5a35; --wood-dark: #5e3a20; --paper: #f8f3e9; --soft: #c9b8a6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0%, #3a2d24 0%, var(--wall) 70%);
      color: var(--paper);
      font-family: "Rubik", system-ui, sans-serif;
    }
    .bar { padding: 16px; }
    .bar a { color: var(--soft); text-decoration: none; font-size: 14px; }
    .bar a:hover { color: var(--paper); }
    h1 {
      margin: 3vh 16px 4px;
      text-align: center;
      font-family: "Fraunces", serif;
      font-weight: 800;
      font-size: clamp(40px, 9vw, 72px);
      letter-spacing: -1px;
    }
    .sub { text-align: center; color: var(--soft); margin: 0 16px 6vh; }
    .shelf { max-width: 900px; margin: 0 auto; padding: 0 16px; }
    .row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(12px, 3vw, 28px);
      padding: 0 12px;
      min-height: 220px;
      flex-wrap: wrap;
    }
    .plank {
      height: 18px;
      background: linear-gradient(var(--wood) 0%, var(--wood-dark) 100%);
      border-radius: 3px;
      box-shadow: 0 10px 18px -6px rgba(0, 0, 0, 0.6);
      margin-bottom: 40px;
    }
    /* a game box, standing on its edge, its lid facing out */
    .box {
      width: 170px;
      height: 200px;
      border-radius: 6px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: transform 0.18s ease;
      box-shadow: 6px 0 0 rgba(0, 0, 0, 0.25), 0 14px 22px -10px rgba(0, 0, 0, 0.7);
    }
    a.box:hover { transform: translateY(-8px) rotate(-1deg); }
    .box.wave { background: #120b1c; color: #fffaed; }
    .box.wave svg { position: absolute; left: 10px; right: 10px; bottom: 16px; width: calc(100% - 20px); }
    .box.wave .name {
      position: absolute; top: 18px; left: 0; right: 0; text-align: center;
      font-family: "Paytone One", sans-serif; font-size: 24px;
      text-shadow: 0 0 2px #fff, 0 0 6px #ffcc73, 0 0 12px #ff8033, 0 0 20px #fa47bd;
    }
    .box.wave .tag { position: absolute; top: 52px; left: 0; right: 0; text-align: center; font-size: 11px; color: #ff73e0; }
    .box.imp { background: #1f1535; color: #f6f0ff; }
    .box.imp svg { position: absolute; left: 14px; right: 14px; bottom: 14px; width: calc(100% - 28px); }
    .box.imp .name {
      position: absolute; top: 18px; left: 0; right: 0; text-align: center;
      font-family: "Fraunces", serif; font-weight: 800; font-size: 25px; letter-spacing: -0.5px;
    }
    .box.imp .tag { position: absolute; top: 52px; left: 0; right: 0; text-align: center; font-size: 11px; color: #ff6d8f; }
    .box.soon {
      border: 2px dashed rgba(201, 184, 166, 0.35);
      box-shadow: none;
      display: flex; align-items: center; justify-content: center;
      color: rgba(201, 184, 166, 0.55);
      font-size: 13px;
    }
    @media (max-width: 520px) {
      .box { width: 140px; height: 168px; }
      .box.wave .name, .box.imp .name { font-size: 21px; }
      .box.soon:nth-of-type(n+3) { display: none; }
    }
  </style>
</head>
<body>
  <div class="bar"><a href="../">&larr; kmufti.com</a></div>
  <h1>Game Board</h1>
  <p class="sub">Board games, off the shelf and onto your phone.</p>

  <div class="shelf">
    <div class="row">
      <a class="box wave" href="frequency/">
        <span class="name">Frequency</span>
        <span class="tag">read your friends' minds</span>
        <svg viewBox="-100 -100 200 108" aria-hidden="true">
          <circle r="96" fill="#ff73e0"/>
          <circle r="90" fill="#0a299e"/>
          <circle r="84" fill="#070b3a"/>
          <path d="M0 0L-27 -80A84 84 0 0 1 -12 -83Z" fill="#fa47bd"/>
          <path d="M0 0L-12 -83A84 84 0 0 1 3 -84Z" fill="#ff8033"/>
          <path d="M0 0L3 -84A84 84 0 0 1 18 -82Z" fill="#ffcc73"/>
          <path d="M0 0L18 -82A84 84 0 0 1 32 -78Z" fill="#ff8033"/>
          <path d="M0 0L32 -78A84 84 0 0 1 45 -71Z" fill="#fa47bd"/>
          <rect x="-100" y="0" width="200" height="8" fill="#0a299e"/>
          <rect x="-100" y="-3" width="18" height="6" rx="3" fill="#9ed6ff"/>
          <rect x="82" y="-3" width="18" height="6" rx="3" fill="#9ed6ff"/>
          <path d="M-2.5 0L0 -80L2.5 0Z" fill="#fffaed" transform="rotate(12)"/>
          <circle r="14" fill="#fa47bd"/>
        </svg>
      </a>
      <a class="box imp" href="inposter/">
        <span class="name">Inposter</span>
        <span class="tag">one of you is faking it</span>
        <svg viewBox="0 0 120 96" aria-hidden="true">
          <rect x="10" y="22" width="44" height="62" rx="7" fill="#f6f0ff" transform="rotate(-12 32 53)"/>
          <rect x="66" y="22" width="44" height="62" rx="7" fill="#f6f0ff" transform="rotate(12 88 53)"/>
          <rect x="38" y="14" width="44" height="64" rx="7" fill="#ff3d6e"/>
          <text x="60" y="58" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" fill="#fff">?</text>
        </svg>
      </a>
      <div class="box soon">coming soon</div>
      <div class="box soon">coming soon</div>
    </div>
    <div class="plank"></div>
  </div>
</body>
</html>
