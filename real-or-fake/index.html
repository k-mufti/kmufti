<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real or Fake — kmufti.com</title>
  <link rel="icon" href="favicon.svg?v=1" type="image/svg+xml" />
  <meta name="description" content="Ten headlines a day. Some really happened. Some are satire, some were made up by AI. Call it." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
  <header class="site-header">
    <span><a class="brand" href="../">kmufti.com</a> <span class="crumb">/ real or fake</span></span>
    <span class="tally" id="tally"></span>
  </header>

  <main>
    <div class="masthead">
      <div class="rule"></div>
      <h1>Real <i>or</i> Fake</h1>
      <div class="dateline"><span id="edition">Today's edition</span><span id="date"></span></div>
      <div class="rule"></div>
    </div>

    <!-- Start -->
    <section class="screen" id="start">
      <p class="lede">Ten headlines. Some really happened. The rest are satire, or were made up by AI.</p>
      <p class="sub">A new edition every day at midnight UTC, the same for everyone.</p>
      <button class="big" id="go">Read today's paper</button>
    </section>

    <!-- A headline -->
    <section class="screen" id="play" hidden>
      <div class="count"><span id="n">1</span> of <span id="of">10</span></div>
      <article class="paper" id="paper">
        <h2 id="headline"></h2>
        <div class="stamp" id="stamp"></div>
      </article>
      <div class="verdict" id="verdict" hidden>
        <p id="verdictText"></p>
        <a id="verdictLink" target="_blank" rel="noopener" hidden>Read the story</a>
      </div>
      <div class="choices" id="choices">
        <button class="real" data-guess="real">Real <kbd>R</kbd></button>
        <button class="fake" data-guess="fake">Fake <kbd>F</kbd></button>
      </div>
      <button class="big" id="next" hidden>Next <kbd>Enter</kbd></button>
    </section>

    <!-- Results -->
    <section class="screen" id="done" hidden>
      <div class="score"><b id="score">0</b><span>/ 10</span></div>
      <p class="rank" id="rank"></p>
      <ol class="recap" id="recap"></ol>
      <div class="stats" id="stats"></div>
      <div class="row">
        <button class="big" id="share">Copy my score</button>
      </div>
      <p class="sub" id="countdown"></p>
    </section>

    <!-- Can't load -->
    <section class="screen" id="error" hidden>
      <p class="lede" id="errorText">Today's paper hasn't arrived yet.</p>
      <button class="big" id="retry">Try again</button>
    </section>
  </main>

  <script src="../you.js"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
