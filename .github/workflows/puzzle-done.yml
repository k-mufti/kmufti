# Once a day: move solved jigsaw puzzles from puzzle/images/puzzles-queue/ to
# puzzle/images/done-puzzles/ (see puzzle/move-done.js), commit, and deploy.
name: Move solved puzzles

on:
  schedule:
    - cron: "0 10 * * *" # daily, 10:00 UTC
  workflow_dispatch: # a "Run workflow" button in the Actions tab

permissions:
  contents: write # push the move
  actions: write  # start the deploy

concurrency:
  group: puzzle-done
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # move-done.js reads when each file was added

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Move solved puzzles
        run: node puzzle/move-done.js

      - name: Commit, push and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then echo "nothing moved"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Jigsaw: solved puzzles moved to done-puzzles"
          git push
          # A push made with the job's own token doesn't start other workflows,
          # so start the deploy by hand.
          gh workflow run deploy.yml --ref main
