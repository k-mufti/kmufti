<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>kmufti.com</title>
  <meta name="description" content="A small collection of apps and experiments by Kareem Muftee." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@1,600;1,700&family=Inter:wght@100;200;300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <header class="site-header">
    <span class="header-left">
      <span class="brand">kmufti.com</span>
    </span>
    <a class="header-link" href="https://kareemmuftee.com">kareemmuftee.com &rarr;</a>
  </header>

  <!-- The launcher: tiles on a mounting board. (The shared pixel canvas that
       used to live behind these tiles is now its own project: white-canvas/) -->
  <main class="hub">
    <div class="app-board">
      <p class="hub-tagline">small things i've built &middot; one click away</p>
      <div class="apps" id="apps"><!-- tiles injected from projects.js --></div>
    </div>
  </main>

  <!-- Deep space: below the launcher. Home for handles / links. -->
  <footer class="deep-space">
    <nav class="handles">
      <!-- Fill these in with your real links. -->
      <a href="#">contact</a>
      <a href="#">donate</a>
      <a href="#">github</a>
      <a href="#">twitter</a>
    </nav>
    <p class="deep-caption">made by kareem muftee</p>
  </footer>

  <script src="projects.js?v=8"></script>
  <script src="artwork.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
